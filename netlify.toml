[build]
  publish = "."
  command = ""

# Helfer zum Hinzufügen von Quellen direkt aus Seite/App (braucht GITHUB_TOKEN bei Netlify)
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
