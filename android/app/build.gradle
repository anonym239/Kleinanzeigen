plugins {
    id 'com.android.application'
}

// Version kommt aus dem GitHub-Workflow (fortlaufende Nummer), damit Updates über alte Versionen installiert werden können
def versionCodeEnv = (System.getenv("VERSION_CODE") ?: "1") as int
def versionNameEnv = System.getenv("VERSION_NAME") ?: "1.0"

android {
    namespace 'de.flohmarktfinder.app'
    compileSdk 34

    defaultConfig {
        applicationId "de.flohmarktfinder.app"
        minSdk 26          // Android 8 und neuer (also auch Android 12)
        targetSdk 34
        versionCode versionCodeEnv
        versionName versionNameEnv
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "flohmarkt-release.p12")
            storeType "pkcs12"
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "flohmarkt-finder"
            keyAlias System.getenv("KEY_ALIAS") ?: "flohmarkt"
            keyPassword System.getenv("KEY_PASSWORD") ?: "flohmarkt-finder"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
