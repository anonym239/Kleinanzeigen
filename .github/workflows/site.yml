name: Termine suchen & Webseite veröffentlichen
on:
  schedule:
    - cron: "23 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:
  push:
    paths: [config.json, app/**, .github/workflows/site.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLOHMARKT_DB: data/flohmarkt.db
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      # Datenbank vom letzten Lauf wiederherstellen (bekannte Anzeigen, Geo-Daten, "NEU"-Markierung)
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: flohmarkt-db-${{ github.run_id }}
          restore-keys: flohmarkt-db-

      - name: Termine suchen und Webseite bauen
        run: python -m app.build_site --config config.json --out site

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: flohmarkt-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
