name: Termine suchen & Webseite veröffentlichen
# Sucht alle 3 Stunden neue Termine und legt die fertige Webseite in den Branch "live".
# Netlify ist mit dem Branch "live" verknüpft und veröffentlicht jede Änderung automatisch.
on:
  schedule:
    - cron: "23 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:
  push:
    paths: [config.json, app/**, netlify/**, .github/workflows/site.yml]

permissions:
  contents: write   # zum Aktualisieren des Branches "live"

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLOHMARKT_DB: data/flohmarkt.db
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      # Datenbank vom letzten Lauf wiederherstellen (bekannte Anzeigen, Geo-Daten, "NEU"-Markierung)
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: flohmarkt-db-${{ github.run_id }}
          restore-keys: flohmarkt-db-

      - name: Termine suchen und Webseite bauen
        env:
          # Optional: Claude prüft neue Anzeigen und liest schwierige Webseiten (Secret in den Repo-Einstellungen)
          # (andere übliche Namen werden auch akzeptiert, falls das Secret anders benannt wurde)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_KEY || secrets.CLAUDE_KEY || secrets.API_KEY }}
        run: python -m app.build_site --config config.json --out site

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: flohmarkt-db-${{ github.run_id }}

      - name: Webseite in Branch "live" legen (Netlify veröffentlicht automatisch)
        run: |
          git config user.name "flohmarkt-bot"
          git config user.email "flohmarkt-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin live >/dev/null; then
            git fetch --depth 1 origin live
            git worktree add -B live /tmp/live origin/live
          else
            git worktree add --orphan -b live /tmp/live
          fi
          find /tmp/live -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. /tmp/live/
          cd /tmp/live
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -q -m "Termine aktualisiert $(date +'%d.%m.%Y %H:%M')"
            git push origin live
          fi
