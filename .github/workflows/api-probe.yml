name: API-Probe (Entwicklung, wird wieder entfernt)
on:
  push:
    paths: [.github/workflows/api-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wetter (Open-Meteo)
        run: |
          curl -sS -D - -H "Origin: https://anzeigen4you.netlify.app" "https://api.open-meteo.com/v1/forecast?latitude=54.29&longitude=10.18&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=3" | head -c 1500
      - name: OSRM FOSSGIS table
        run: |
          curl -sS -D - -H "Origin: https://anzeigen4you.netlify.app" "https://routing.openstreetmap.de/routed-car/table/v1/driving/10.18,54.29;10.13,54.32;9.98,54.07?annotations=duration,distance" | head -c 1500
      - name: OSRM FOSSGIS route
        run: |
          curl -sS -D - -H "Origin: https://anzeigen4you.netlify.app" "https://routing.openstreetmap.de/routed-car/route/v1/driving/10.18,54.29;10.13,54.32;9.98,54.07?overview=false" | head -c 1500
      - name: OSM Kacheln CORS
        run: |
          curl -sS -o /dev/null -D - -H "Origin: https://anzeigen4you.netlify.app" "https://tile.openstreetmap.org/10/544/326.png" | head -20
