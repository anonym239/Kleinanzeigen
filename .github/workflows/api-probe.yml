name: API-Probe (Entwicklung, wird wieder entfernt)
on:
  push:
    paths: [.github/workflows/api-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify-Helfer (harmlos, nicht eingetragene Adresse)
        run: |
          curl -sS -D - -X POST "https://anzeigen4you.netlify.app/.netlify/functions/sources" -H "Content-Type: application/json" -H "Origin: https://appassets.androidplatform.net" -d '{"action":"remove","url":"https://example.org","pin":""}'
      - name: Netlify CORS-Vorabfrage
        run: |
          curl -sS -D - -o /dev/null -X OPTIONS "https://anzeigen4you.netlify.app/.netlify/functions/sources" -H "Origin: https://appassets.androidplatform.net" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type"
      - name: Stand Netlify vs. GitHub
        run: |
          curl -sS "https://anzeigen4you.netlify.app/data/events.json" | python3 -c "import json,sys,time; d=json.load(sys.stdin); print('Netlify:', time.ctime(d['generated_at']), [s['name'] for s in d['sources']])"
          curl -sS "https://raw.githubusercontent.com/anonym239/Kleinanzeigen/live/data/events.json" | python3 -c "import json,sys,time; d=json.load(sys.stdin); print('GitHub :', time.ctime(d['generated_at']))"
          curl -sS "https://anzeigen4you.netlify.app/static/app.js" | grep -c "renderDataAge" || true
