name: API-Probe (Entwicklung, wird wieder entfernt)
on:
  push:
    paths: [.github/workflows/api-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: marktcom Liste PLZ 2
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          curl -sSL -m 30 -A "$UA" "https://www.marktcom.de/termine/plz?q%5Bevent_plz_start%5D=2" > l.html
          echo "Größe: $(wc -c < l.html)  Veranstaltungslinks: $(grep -o '/veranstaltung/' l.html | wc -l)"
          grep -oE 'href="[^"]*page=[0-9]+[^"]*"' l.html | sort -u | head
          python3 - <<'PY'
          import re
          h=open('l.html',encoding='utf-8',errors='ignore').read()
          i=h.find('/veranstaltung/')
          print(h[max(0,i-2500):i+2500])
          PY
      - name: marktcom Detailseite
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          link=$(grep -oE '/veranstaltung/[^"?]+' <(curl -sSL -m 30 -A "$UA" "https://www.marktcom.de/termine/plz?q%5Bevent_plz_start%5D=2") | head -1)
          echo "Detail: $link"
          curl -sSL -m 30 -A "$UA" "https://www.marktcom.de$link" > d.html
          grep -c 'application/ld+json' d.html
          python3 - <<'PY'
          import re
          h=open('d.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', h, re.S): print(m.group(1)[:1500])
          t=re.sub(r'<[^>]+>',' ',h); t=re.sub(r'\s+',' ',t)
          i=t.find('Termin'); print(t[max(0,i-300):i+1200])
          PY
      - name: LN Feed Titel
        run: |
          curl -sSL -m 25 "https://www.ln-online.de/arc/outboundfeeds/rss/category/lokales/segeberg/" | python3 -c "import sys,re; x=sys.stdin.read(); print(re.findall(r'<title><!\[CDATA\[(.*?)\]\]>', x)[:8])"
